name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (Vite + prerender SEO)
        run: npm run build
        env:
          NODE_ENV: production

      # vercel.json já é copiado para dist/ no `npm run build`
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Evita `vercel pull` (falhava com secrets inválidos/expirados).
      # Faz upload do dist já buildado (inclui HTML prerenderizado + rewrites).
      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          set -o pipefail
          test -f dist/vercel.json
          test -f dist/index.html
          test -f dist/spa.html
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            OUTPUT=$(vercel deploy dist --yes --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}" 2>&1)
            echo "$OUTPUT"
            DEPLOY_URL=$(echo "$OUTPUT" | grep -oE 'https://[^[:space:]]+\.vercel\.app' | head -1)
            echo "preview_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
            echo "🚀 Preview deployment: $DEPLOY_URL"
          else
            OUTPUT=$(vercel deploy dist --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}" 2>&1)
            echo "$OUTPUT"
            DEPLOY_URL=$(echo "$OUTPUT" | grep -oE 'https://[^[:space:]]+\.vercel\.app' | head -1)
            echo "production_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
            echo "✅ Production deployment: $DEPLOY_URL"
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request' && steps.vercel-deploy.outputs.preview_url != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = '${{ steps.vercel-deploy.outputs.preview_url }}';
            if (url && url !== '') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 Preview deployment ready!\n\n🔗 ${url}\n\n_Deploy automático via GitHub Actions_`
              });
            }
